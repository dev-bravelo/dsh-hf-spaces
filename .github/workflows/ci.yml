name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tests
        run: node --test --test-reporter=spec

      - name: Secret and personal-path scan (tracked files)
        run: node scripts/check-secrets.mjs

      - name: gitleaks (whole history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
