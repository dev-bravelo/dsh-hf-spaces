# gitleaks configuration: the default rule set, plus the token formats this project handles.
# Tests build fake tokens at runtime, so no allowlist is needed for fixtures.
title = "dsh-hf-spaces"

[extend]
useDefault = true

[[rules]]
id = "huggingface-token"
description = "Hugging Face access token"
regex = '''\bhf_[A-Za-z0-9]{30,}\b'''
keywords = ["hf_"]
